 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cloud Engineering Challenge | Doc Dott</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <main class="challenge">
        <section class="challenge-container">

            <header class="challenge-header">
                <p class="challenge-label">Test Your Understanding</p>
                <h1>Cloud Engineering Challenge</h1>
                <p class="challenge-intro">
                    Five questions. One request path. See how well you can
                    reason through the architecture.
                </p>
            </header>

            <div class="quiz">

                <div class="quiz-progress">
                    <span id="question-number">Question 1 of 5</span>
                </div>

                <div id="question-container">
                    <!-- JavaScript will render each question here -->
                </div>

                <div id="feedback" class="quiz-feedback" hidden>
                    <!-- Answer explanation appears here -->
                </div>

                <button id="quiz-action" type="button">
                    Check Answer
                </button>

            </div>

            <div id="quiz-result" class="quiz-result" hidden>
                <!-- Final score appears here -->
            </div>

        </section>
    </main>

    <script src="js/challenge.js"></script>

</body>
</html>
